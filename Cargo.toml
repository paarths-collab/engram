[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/repo-map",
    "crates/retrieval",
    "crates/verify",
    "crates/connectors-github",
    "crates/mcp-server",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.30", features = ["bundled"] }
walkdir = "2"
toml = "0.8"
serde_yaml = "0.9"
globset = "0.4"
petgraph = "0.6"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
